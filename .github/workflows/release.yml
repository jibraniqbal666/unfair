name: Build and Release APK and AAB

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi

      - name: Build Release APK and AAB
        run: ./gradlew assembleLawnWithQuickstepGithubRelease bundleLawnWithQuickstepPlayRelease

      - name: Get version info
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT
          fi
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename APK and AAB
        run: |
          mkdir -p release
          mv build/outputs/apk/lawnWithQuickstepGithub/release/*.apk release/Unfair-${{ steps.version.outputs.version }}.apk
          mv build/outputs/bundle/lawnWithQuickstepPlayRelease/*.aab release/Unfair-${{ steps.version.outputs.version }}.aab

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Unfair-Release
          path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Unfair ${{ steps.version.outputs.version }}
          body: |
            ## Unfair ${{ steps.version.outputs.version }}

            **Release Date:** ${{ steps.version.outputs.date }}
            **Commit:** ${{ steps.version.outputs.sha_short }}

            ### Downloads
            - **APK** - Direct install on Android devices
            - **AAB** - For Play Store distribution

            ### Installation (APK)
            1. Download the APK file below
            2. Enable "Install from unknown sources" if prompted
            3. Install and enjoy!

            ---
            *Built automatically from commit ${{ github.sha }}*
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
